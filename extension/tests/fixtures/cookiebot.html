<!doctype html><meta charset=utf-8><title>Cookiebot</title><script src="_common.js"></script>
<body><h1>Blog</h1>
<div id="CybotCookiebotDialog" style="position:fixed;bottom:20px;left:20px;width:500px;background:#fff;padding:16px;border:1px solid">
  <h2>This website uses cookies</h2>
  <p>We use cookies to personalise content and ads and to analyse our traffic.</p>
  <button id="CybotCookiebotDialogBodyButtonDecline" onclick="record('reject');hide('#CybotCookiebotDialog')">Deny</button>
  <button id="CybotCookiebotDialogBodyLevelButtonCustomize" onclick="record('settings')">Customize</button>
  <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll" onclick="record('accept');hide('#CybotCookiebotDialog')">Allow all</button>
</div></body>
