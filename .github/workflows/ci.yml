name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install "./api[test]"
      - run: python -m playwright install --with-deps chromium
      - run: python tools/sync_generated.py --check
      - run: python -m pytest api/tests -q
      - run: node extension/tests/scoring_parity.mjs
      - run: python -m pytest extension/tests -q
      - run: python extension/build.py
